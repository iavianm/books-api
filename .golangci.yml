version: "2"

run:
  timeout: 3m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - unparam

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
